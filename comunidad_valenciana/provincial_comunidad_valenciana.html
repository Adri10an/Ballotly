<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provincias de la Comunidad Valenciana</title>

<link rel="stylesheet" href="../../css/comunidad_valenciana/provincial_comunidad_valenciana.css">
</head>
<body>
<h1>Selecciona una circunscripción</h1>
<div class="container">
    <div class="boton-con-texto"><span class="provincia-label-overlay">Castellón</span><button class="button castellon" onclick="abrirVentana('Castellón')"></button></div>
    <div class="boton-con-texto"><span class="provincia-label-overlay">Valencia</span><button class="button valencia" onclick="abrirVentana('Valencia')"></button></div>
    <div class="boton-con-texto"><span class="provincia-label-overlay">Alicante</span><button class="button alicante" onclick="abrirVentana('Alicante')"></button></div>
    <div class="boton-con-texto"><span class="provincia-label-overlay">C. Valenciana</span><button class="button comunidadvalenciana" onclick="abrirVentana('Comunidad Valenciana')"></button></div>
</div>

<div style="margin-top: 80px;"></div>

<h1>Si la Comunidad Valenciana hubiera repartido siempre 99 escaños</h1>
<div class="container">
    <div class="boton-con-texto"><span class="provincia-label-overlay">Castellón</span><button class="button castellon" onclick="abrirVentanaEscenario99('Castellón')"></button></div>
    <div class="boton-con-texto"><span class="provincia-label-overlay">Valencia</span><button class="button valencia" onclick="abrirVentanaEscenario99('Valencia')"></button></div>
    <div class="boton-con-texto"><span class="provincia-label-overlay">Alicante</span><button class="button alicante" onclick="abrirVentanaEscenario99('Alicante')"></button></div>
    <div class="boton-con-texto"><span class="provincia-label-overlay">C. Valenciana</span><button class="button comunidadvalenciana" onclick="abrirVentanaEscenario99('Comunidad Valenciana')"></button></div>
</div>
<script src="../../js/comunidad_valenciana/provincial_comunidad_valenciana.js"></script>
